### logger configuration
# Root log level
logging.level.root=INFO
# Set log level for your package
logging.level.com.samadhan=DEBUG
# Log file
logging.file.name=logs/app.log
# Log pattern (optional)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

### maps configuration
maps.api.key=${MAPS_API_KEY}

### storage configuration
storage.bucket-name=${B2_BUCKET_NAME}
storage.endpoint=${B2_ENDPOINT}
storage.region=${B2_REGION}
storage.access-key=${B2_ACCESS_KEY}
storage.secret-key=${B2_SECRET_KEY}

# Multipart configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

### transfer cache configuration
transfer.cache.ttl.millis=300000


