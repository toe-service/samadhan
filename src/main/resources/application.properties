server.port = 8082

# Which environment profile to run. Overridable via the SPRING_PROFILES_ACTIVE env var
# (Spring Boot honors it automatically) without touching this file — set it to "prod" on the
# Railway service. Defaults to "dev" so a plain local run (IDE / mvn spring-boot:run) just works.
# See application-dev.properties / application-prod.properties for everything that differs by
# environment (datasource, secrets, log levels, strictness of required config).
spring.profiles.active=dev

### database configuration — dialect/driver are the same everywhere; url/username/password and
### ddl-auto/show-sql are per-profile, see application-{dev,prod}.properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


### fast2sms configuration (URL is a public constant; the token is per-profile — required in
### prod, optional in dev — see application-{dev,prod}.properties)
sms.service.provider.url = https://www.fast2sms.com/dev/bulkV2


### logger configuration (levels are per-profile — see application-{dev,prod}.properties)
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Multipart configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

### transfer cache configuration
transfer.cache.ttl.millis=300000

### JWT configuration (secret is per-profile — see application-{dev,prod}.properties)
jwt.expiration.time=900000
jwt.refresh.expiration=86400000
