### dev profile — local machine defaults. Secrets are optional here (empty string if unset)
### so a plain local checkout can boot without needing every third-party credential; features
### that actually call out (SMS, payment, maps, file storage) just won't work until you set the
### real env var, but the app itself still starts.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/samadhan
spring.datasource.username=root
spring.datasource.password=root

logging.level.root=INFO
logging.level.com.samadhan=DEBUG

# Matches the value currently deployed in prod (see application-prod.properties' JWT_SECRET_KEY
# comment) — tokens minted locally and in prod are interchangeable, which is convenient for
# local debugging against prod-issued tokens and vice versa.
jwt.secret.key=Vhl//LHYRuRrqv5F7qmtYdo2Fjpejt03DJ5DFXWy4oYTXIVia2TvMg==

sms.client.token=${SMS_CLIENT_KEY:}
pay.key=${PAYMENT_KEY:}
pay.secret=${PAYMENT_SECRET:}
maps.api.key=${MAPS_API_KEY:}

# StorageService's @PostConstruct builds an S3 client unconditionally at startup, so these
# need to resolve to something even without real credentials. NOTE: an empty B2_ENDPOINT may
# still fail S3Client.build() (untested here, no local Maven available to verify) — if it does,
# set real B2_* values locally or keep StorageService's body commented out, same as you've
# already been doing in your working tree.
storage.bucket-name=${B2_BUCKET_NAME:}
storage.endpoint=${B2_ENDPOINT:}
storage.region=${B2_REGION:us-east-1}
storage.access-key=${B2_ACCESS_KEY:}
storage.secret-key=${B2_SECRET_KEY:}
