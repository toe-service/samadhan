### test profile — for running the actual server on its own Railway service, against its own
### MySQL database (kept separate from prod so test writes never touch real production data).
###
### NOTE: this is unrelated to src/test/resources/application-test.properties, which configures
### an in-memory H2 database for automated JUnit tests only. During `mvn test`, that file takes
### precedence (test-classes are ahead of main classes on the test classpath), so this file only
### applies when you actually run the server with SPRING_PROFILES_ACTIVE=test.
###
### Required env vars on the Railway test service (from its own MySQL plugin instance, NOT
### prod's — see prod's DB_NAME/DB_USERNAME/DB_PASSWORD, which point at a different database):
###   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
### Running this locally instead of on Railway? Point these at your local MySQL, e.g.
### DB_HOST=localhost DB_PORT=3306 DB_NAME=samadhan DB_USERNAME=root DB_PASSWORD=root.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

logging.level.root=INFO
logging.level.com.samadhan=DEBUG

# Matches the value currently deployed in prod (see application-prod.properties' JWT_SECRET_KEY
# comment) — tokens minted here and in prod are interchangeable.
jwt.secret.key=Vhl//LHYRuRrqv5F7qmtYdo2Fjpejt03DJ5DFXWy4oYTXIVia2TvMg==

sms.client.token=${SMS_CLIENT_KEY:}
pay.key=${PAYMENT_KEY:}
pay.secret=${PAYMENT_SECRET:}
maps.api.key=${MAPS_API_KEY:}

# StorageService's @PostConstruct builds an S3 client unconditionally at startup, so these
# need to resolve to something even without real credentials. NOTE: an empty B2_ENDPOINT may
# still fail S3Client.build() (untested here, no local Maven available to verify).
storage.bucket-name=${B2_BUCKET_NAME:}
storage.endpoint=${B2_ENDPOINT:}
storage.region=${B2_REGION:us-east-1}
storage.access-key=${B2_ACCESS_KEY:}
storage.secret-key=${B2_SECRET_KEY:}
