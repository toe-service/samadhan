### prod profile (Railway). Every secret/connection value below comes from an env var with NO
### literal fallback — matches what's actually required by the last successful deploy (checked
### against git history), so this should be a no-op for a Railway service that's already
### configured, not a change in what's required to boot.
###
### Required env vars — verify these are already set on the Railway service before deploying
### with SPRING_PROFILES_ACTIVE=prod:
###   DB_NAME, DB_USERNAME, DB_PASSWORD
###     Verify the current values (and the proxy host/port below) against the Railway MySQL
###     plugin's "Connect" tab — this restores a historical/commented-out config from this same
###     file, and the host/port may have since been rotated.
###   JWT_SECRET_KEY
###     Must be set to today's literal secret (see application-dev.properties) before this
###     deploys. Startup fails if unset; deploying with a *different* value signs out every
###     currently-logged-in user, since existing tokens were issued with the old key.
###   SMS_CLIENT_KEY, PAYMENT_KEY, PAYMENT_SECRET, MAPS_API_KEY,
###   B2_BUCKET_NAME, B2_ENDPOINT, B2_REGION, B2_ACCESS_KEY, B2_SECRET_KEY
###     Already required today (StorageService's @PostConstruct builds an S3 client
###     unconditionally at startup) — should already be set if prod is currently running.
###   MAIL_USERNAME, MAIL_APP_PASSWORD (optional — NOT required to boot, see spring.mail.* below)
###     Gmail address + app password for LogEmailScheduler's nightly log email. Not set yet as
###     of when this was added — the job just logs a warning and skips sending until they are.
###
### ddl-auto is deliberately left at "update", not tightened to "validate" — there's no
### migration tool in this project (no Flyway/Liquibase), so Hibernate auto-updating the schema
### on boot is the only thing currently keeping prod's tables in sync with the entities.
### Switching to "validate" would need every db_migrations/*.sql script actually run against
### prod first, or the next boot fails outright.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.url=jdbc:mysql://metro.proxy.rlwy.net:37380/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

logging.level.root=WARN
logging.level.com.samadhan=INFO

jwt.secret.key=${JWT_SECRET_KEY}

sms.client.token=${SMS_CLIENT_KEY}
pay.key=${PAYMENT_KEY}
pay.secret=${PAYMENT_SECRET}
maps.api.key=${MAPS_API_KEY}

# LogEmailScheduler's daily log email (see also application.properties' logs.email.*).
# Deliberately NOT following this file's usual "no default, fail loudly" pattern: MAIL_USERNAME/
# MAIL_APP_PASSWORD aren't set on Railway yet as of when this was added, and every other required
# var here binds via @ConfigurationProperties at startup (spring.mail.* included, once
# spring.mail.host is set), which would crash the *entire* app on next boot if left unresolved.
# Once you've added real values for both on the Railway service, switch these two lines to
# ${MAIL_USERNAME} / ${MAIL_APP_PASSWORD} (no trailing colon) to match the strict convention.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

storage.bucket-name=${B2_BUCKET_NAME}
storage.endpoint=${B2_ENDPOINT}
storage.region=${B2_REGION}
storage.access-key=${B2_ACCESS_KEY}
storage.secret-key=${B2_SECRET_KEY}
