### test database configuration (in-memory H2, no external MySQL needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

### dummy value so the required @Value field on SamadhanApplication resolves during context startup;
### the real FirebaseMessaging bean is replaced with a @MockBean in tests, so this value is never parsed
FIREBASE_SERVICE_ACCOUNT_JSON={}

### dummy values so required @Value fields (GaadiService, LoginService, PaymentServiceImpl, RouteService)
### resolve during context startup; none of these are called in tests, so the values themselves don't matter
sms.client.token=test-sms-client-token
pay.key=test-pay-key
pay.secret=test-pay-secret
maps.api.key=test-maps-api-key
